# Every push to main updates one release PR, or can be triggered manually.
name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: brew install make dpkg ldid

      # Read flag table secret if exists, or create fallback if missing in fork
      - name: Flag table
        env:
          SG_FLAG_LIST: ${{ secrets.SG_FLAG_LIST }}
        run: |
          if [ -n "$SG_FLAG_LIST" ]; then
            echo "$SG_FLAG_LIST" | base64 -d | gunzip > tweak/Sources/Shared/Flags/SGFlagList.m
          else
            echo "::warning::SG_FLAG_LIST secret missing. Ensuring file exists..."
            mkdir -p tweak/Sources/Shared/Flags
            [ -f tweak/Sources/Shared/Flags/SGFlagList.m ] || touch tweak/Sources/Shared/Flags/SGFlagList.m
          fi

      - name: Build
        run: env -u MAKELEVEL gmake -C tweak clean package

      # Upload the generated .deb as a downloadable build artifact
      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotifyglass-deb
          path: tweak/packages/*.deb
